<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b4e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="shieldBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b29" />
      <stop offset="45%" stop-color="#14111f" />
      <stop offset="100%" stop-color="#0b0a12" />
    </linearGradient>
    <radialGradient id="shieldInnerGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="swooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#ff6b7a" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Crest Glow -->
  <path d="M100 12 L164 42 C164 122, 134 172, 100 202 C66 172, 36 122, 36 42 Z" 
        stroke="url(#shieldBorder)" stroke-width="7" stroke-linejoin="round" fill="url(#shieldBody)" />
  
  <!-- Inner Ambient Glow -->
  <path d="M100 16 L160 44 C160 118, 132 166, 100 196 C68 166, 40 118, 40 44 Z" 
        fill="url(#shieldInnerGlow)" />
  
  <!-- Inner Rim -->
  <path d="M100 22 L152 48 C152 112, 128 156, 100 184 C72 156, 48 112, 48 48 Z" 
        stroke="#4a4458" stroke-width="2.5" stroke-opacity="0.6" stroke-linejoin="round" fill="none" />

  <!-- Guardian Figure (Head) -->
  <circle cx="100" cy="74" r="13" fill="#ffffff" filter="url(#glowEffect)" />

  <!-- Guardian Figure (Arms & Shoulders embracing safety) -->
  <path d="M62 92 C74 79, 90 85, 100 90 C110 85, 126 79, 138 92 C141 96, 136 100, 130 98 C120 94, 109 98, 100 106 C91 98, 80 94, 70 98 C64 100, 59 96, 62 92 Z" 
        fill="#ffffff" />

  <!-- Pin Body (Teardrop shape pointing down) -->
  <path d="M85 106 C85 96, 115 96, 115 106 C115 119, 100 138, 100 138 C100 138, 85 119, 85 106 Z" 
        fill="#ffffff" />
  
  <!-- Center Pin Dot (Ruby Red Location Beacon) -->
  <circle cx="100" cy="110" r="5.5" fill="#ef4444" />

  <!-- Dynamic Red Swoosh / "X" Wing -->
  <path d="M86 142 C104 135, 122 115, 138 90 C146 76, 154 58, 158 48 C158 48, 150 64, 136 86 C124 105, 110 120, 94 130 C88 134, 82 138, 86 142 Z" 
        fill="url(#swooshGrad)" filter="url(#glowEffect)" />
  <path d="M112 124 L148 160 C151 163, 155 161, 153 157 L132 120 Z" 
        fill="url(#swooshGrad)" opacity="0.85" />
</svg>
